spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:quaver-server/.env[.properties]
  application:
    name: quaver-server
  datasource:
    url: ${QUAVER_DB_URL:jdbc:mysql://127.0.0.1:3306/quaver?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${QUAVER_DB_USERNAME:root}
    password: ${QUAVER_DB_PASSWORD:}
    driver-class-name: ${QUAVER_DB_DRIVER:com.mysql.cj.jdbc.Driver}
  data:
    redis:
      host: ${QUAVER_REDIS_HOST:127.0.0.1}
      port: ${QUAVER_REDIS_PORT:6379}
      password: ${QUAVER_REDIS_PASSWORD:}
      database: ${QUAVER_REDIS_DATABASE:0}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

quaver:
  frontend:
    base-url: ${QUAVER_FRONTEND_BASE_URL:http://127.0.0.1:5173}
    allowed-origins:
      - ${QUAVER_FRONTEND_ORIGIN_LOCALHOST:http://localhost:5173}
      - ${QUAVER_FRONTEND_ORIGIN_LOOPBACK:http://127.0.0.1:5173}
  app:
    default-user-id: ${QUAVER_DEFAULT_USER_ID:demo-user}
    default-username: ${QUAVER_DEFAULT_USERNAME:Demo Listener}
    default-email: ${QUAVER_DEFAULT_EMAIL:demo-user@quaver.local}
  ai:
    api-key: ${QUAVER_AI_API_KEY:}
    model: deepseek-v4-pro
    search-model: deepseek-v4-pro
    agent-model: deepseek-v4-pro
    base-url: https://api.deepseek.com
  spotify:
    enabled: ${QUAVER_SPOTIFY_ENABLED:true}
    client-id: ${QUAVER_SPOTIFY_CLIENT_ID:}
    client-secret: ${QUAVER_SPOTIFY_CLIENT_SECRET:}
    redirect-uri: ${QUAVER_SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/spotify/auth/callback}
    developer-account: ${QUAVER_SPOTIFY_DEVELOPER_ACCOUNT:}
    default-device-id: ${QUAVER_SPOTIFY_DEFAULT_DEVICE_ID:}
    bridge-refresh-token: ${QUAVER_SPOTIFY_BRIDGE_REFRESH_TOKEN:}
    search-market: ${QUAVER_SPOTIFY_SEARCH_MARKET:US}
    scopes:
      - user-read-private
      - user-read-email
      - user-read-playback-state
      - user-read-currently-playing
      - user-modify-playback-state
      - streaming
      - playlist-read-private
      - playlist-read-collaborative
      - playlist-modify-private
      - playlist-modify-public
