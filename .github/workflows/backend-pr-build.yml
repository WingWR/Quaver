name: Backend PR Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quaver-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend
        run: mvn -B -pl quaver-server-boot -am test
